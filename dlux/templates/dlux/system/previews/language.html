<div
    class="dlux-language-picker"
>
    {% if label %}
    <label class="form-label d-block">{{ label }}</label>
    {% endif %}
    {% if help_text %}
    <p class="text-muted small mb-3">{{ help_text }}</p>
    {% endif %}
    <div class="dlux-density-options" role="group" aria-label="{{ label|default:'Language' }}">
        {% for code, lang in languages.items %}
        <button
            type="button"
            class="dlux-density-option{% if code == selected_language %} is-active{% endif %}"
            {% if picker_mode == 'options' %}data-lang="{{ code }}"{% endif %}
            data-dir="{{ lang.dir|default:'ltr' }}"
        >
            <span class="dlux-density-option__icon" aria-hidden="true">
                <span class="dlux-language-flag">{{ lang.flag|default:"🌐" }}</span>
            </span>
            <span class="dlux-density-option__copy">
                <strong>{{ lang.name|default:code }}</strong>
                <small>{{ lang.desc|default:code|upper }}</small>
            </span>
        </button>
        {% endfor %}
    </div>
</div>
