{% for action in ribbon.actions %}{% if action.is_html %}{{ action.html }}{% elif action.is_link %}<a href="{{ action.url }}" class="{{ action.css_class }}"{% for key, value in action.attrs.items %} {{ key }}="{{ value }}"{% endfor %}>{% if action.icon %}<i class="{{ action.icon }} me-1"></i>{% endif %}{{ action.label }}</a>{% else %}<button type="{{ action.type }}" class="{{ action.css_class }}"{% for key, value in action.attrs.items %} {{ key }}="{{ value }}"{% endfor %}>{% if action.icon %}<i class="{{ action.icon }} me-1"></i>{% endif %}{{ action.label }}</button>{% endif %}
{% endfor %}
