<div class="dlux-report-builder-actions">
    <button type="button" class="btn btn-sm btn-outline-primary dlux-report-select-btn" data-report-select="all" title="{{ DLUX_STRINGS.reports_include_all|default:'Include all' }}" aria-label="{{ DLUX_STRINGS.reports_include_all|default:'Include all' }}"><i class="bi bi-check2-square" aria-hidden="true"></i></button>
    <button type="button" class="btn btn-sm btn-outline-secondary dlux-report-select-btn" data-report-select="none" title="{{ DLUX_STRINGS.reports_exclude_all|default:'Exclude all' }}" aria-label="{{ DLUX_STRINGS.reports_exclude_all|default:'Exclude all' }}"><i class="bi bi-square" aria-hidden="true"></i></button>
</div>
