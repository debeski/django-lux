{% load crispy_forms_tags %}

<div class="d-flex justify-content-between mb-3">
    <h5 class="modal-title">{% if scope_id %}{{ DLUX_STRINGS.edit_scope|default:"Edit Scope" }}{% else %}{{ DLUX_STRINGS.add_scope|default:"Add New Scope" }}{% endif %}</h5>
    <button class="btn btn-outline-secondary rounded-pill dlux-back-link js-load-scope-form" data-url="{% url 'manage_scopes' %}">
        <i class="bi bi-arrow-left me-1"></i> {{ DLUX_STRINGS.back_to_list|default:"Back to List" }}
    </button>
</div>

<form id="scopeForm" class="dlux-form" data-url="{% url 'save_scope' %}{% if scope_id %}/{{ scope_id }}{% endif %}">
    {% csrf_token %}
    {% crispy form %}

    <div class="mt-3 text-center">
        <button type="submit" class="btn btn-primary rounded-pill w-100">
            <i class="bi bi-save me-1"></i> {{ DLUX_STRINGS.save|default:"Save" }}
        </button>
    </div>
</form>
