{% load crispy_forms_tags %}

<form method="post"
      class="dlux-form{% if form.extra_form_class %} {{ form.extra_form_class }}{% endif %}"
      action="{{ request.path }}{% if request.GET %}?{{ request.GET.urlencode }}{% endif %}"
      {% if form.is_multipart %}enctype="multipart/form-data"{% endif %}
      {% if form.dlux_system_preview_counts %}data-dlux-allowed-theme-count="{{ form.dlux_system_preview_counts.allowed_themes }}" data-dlux-language-count="{{ form.dlux_system_preview_counts.languages }}"{% endif %}
      {% if wizard_initial_step is not None %}data-dlux-wizard-initial-step="{{ wizard_initial_step }}"{% endif %}>
    {% csrf_token %}
    {% crispy form %}
    {% if not hide_form_buttons %}
        <div class="dlux-form-actions mt-3 pt-3 border-top">
            {% if instance %}
                <button type="submit" class="dlux-form-action dlux-form-action-primary" aria-label="{{ DLUX_STRINGS.btn_update|default:'Update' }}" title="{{ DLUX_STRINGS.btn_update|default:'Update' }}">
                    <span class="dlux-form-action-icon"><i class="bi bi-check-lg" aria-hidden="true"></i></span>
                    <span class="visually-hidden">{{ DLUX_STRINGS.btn_update|default:"Update" }}</span>
                </button>
                <button type="button" class="dlux-form-action dlux-form-action-neutral dynamic-back-btn" aria-label="{{ DLUX_STRINGS.btn_cancel|default:'Cancel' }}" title="{{ DLUX_STRINGS.btn_cancel|default:'Cancel' }}">
                    <span class="dlux-form-action-icon"><i class="bi bi-x-lg" aria-hidden="true"></i></span>
                    <span class="visually-hidden">{{ DLUX_STRINGS.btn_cancel|default:"Cancel" }}</span>
                </button>
            {% else %}
                <button type="submit" class="dlux-form-action dlux-form-action-primary" aria-label="{{ DLUX_STRINGS.btn_add_new|default:'Add' }}" title="{{ DLUX_STRINGS.btn_add_new|default:'Add' }}">
                    <span class="dlux-form-action-icon"><i class="bi bi-check-lg" aria-hidden="true"></i></span>
                    <span class="visually-hidden">{{ DLUX_STRINGS.btn_add_new|default:"Add" }}</span>
                </button>
            {% endif %}
        </div>
    {% endif %}
</form>
