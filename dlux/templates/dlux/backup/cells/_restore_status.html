{% load dlux_tags %}
{# One cell of SystemRestoreTable; context: restore, status_label, DLUX_STRINGS. #}
{% if restore.status == 'completed' %}<span class="badge bg-success">{{ status_label }}</span>
{% elif restore.status == 'failed' %}<span class="badge bg-danger" title="{{ restore.error }}">{{ status_label }}</span>
{% else %}<span class="badge bg-secondary">{{ status_label }}</span>{% endif %}
