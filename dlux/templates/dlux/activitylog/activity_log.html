{% extends 'dlux/list_page.html' %}
{% load dlux_tags %}

{% block title %}{{ DLUX_STRINGS.log_title }}{% endblock %}

{% block list_modals %}
    <div class="modal fade" id="activityLogDetailModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content glass-card border-0 shadow-lg">
                <div class="modal-body text-center p-5"
                     id="activityLogDetailModalBody"
                     data-loading-text="{{ DLUX_STRINGS.loading|default:'Loading...' }}"
                     data-error-text="{{ DLUX_STRINGS.error_loading_details|default:'Error loading details.' }}"
                     data-close-text="{{ DLUX_STRINGS.btn_close|default:'Close' }}">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">{{ DLUX_STRINGS.loading|default:"Loading..." }}</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}

{% block scripts %}
    {{ block.super }}
    <script src="{% dlux_static 'dlux/activitylog/js/main.js' %}" nonce="{{ request.csp_nonce }}"></script>
{% endblock %}
