<div class="dlux-navbar-builder" data-navbar-builder>
    <textarea class="d-none dlux-navbar-catalog-data">{{ navbar_catalog_json }}</textarea>
    <textarea class="d-none dlux-navbar-config-data">{{ navbar_config_json }}</textarea>
    <textarea class="d-none dlux-navbar-languages-data">{{ languages_json }}</textarea>
    <div class="dlux-navbar-builder__header">
        <div>
            <h6 class="fw-bold mb-1">{{ DLUX_STRINGS.navbar_hierarchy_title }}</h6>
            <p class="text-muted small mb-0">{{ DLUX_STRINGS.navbar_hierarchy_desc }}</p>
        </div>
    </div>

    <div class="dlux-navbar-root-control">
        <div class="dlux-navbar-root-control__label">
            <i class="bi bi-house-door" aria-hidden="true"></i>
            <span>
                <label class="form-label fw-semibold mb-1" for="dlux-navbar-root-{{ mode }}">{{ DLUX_STRINGS.navbar_root_selector }}</label>
                <small class="form-text d-block mt-0">{{ DLUX_STRINGS.navbar_root_selector_help }}</small>
            </span>
        </div>
        <select id="dlux-navbar-root-{{ mode }}" class="form-select glass-input" data-navbar-root-select>
            <option value="neutral">{{ DLUX_STRINGS.navbar_root_default_option }}</option>
            <option value="home">{{ DLUX_STRINGS.navbar_root_home_option }}</option>
        </select>
    </div>

    <section class="dlux-navbar-builder__inspector-row mb-3" data-navbar-inspector-shell></section>

    <div class="dlux-navbar-builder__grid">
        <section class="dlux-navbar-builder__pane">
            <h6 class="fw-semibold mb-2">{{ DLUX_STRINGS.navbar_selected_tree }}</h6>
            <p class="text-muted small">{{ DLUX_STRINGS.navbar_selected_tree_desc }}</p>
            <div class="dlux-navbar-tree" data-navbar-tree></div>
        </section>
        <section class="dlux-navbar-builder__pane">
            <div class="d-flex justify-content-between align-items-start gap-2 flex-wrap mb-2">
                <h6 class="fw-semibold mb-0">{{ DLUX_STRINGS.navbar_available_routes }}</h6>
                <div class="form-check form-switch small mb-0">
                    <input class="form-check-input" type="checkbox" id="navbarSystemItemsToggle-{{ mode }}" data-navbar-system-toggle>
                    <label class="form-check-label fw-semibold" for="navbarSystemItemsToggle-{{ mode }}">
                        {{ DLUX_STRINGS.sidebar_show_system_items|default:"Show system items" }}
                    </label>
                </div>
            </div>
            <label class="visually-hidden" for="dlux-navbar-route-search-{{ mode }}">{{ DLUX_STRINGS.label_keyword }}</label>
            <input id="dlux-navbar-route-search-{{ mode }}" type="search" class="form-control glass-input form-control-sm mb-3"
                   placeholder="{{ DLUX_STRINGS.navbar_route_search }}" data-navbar-route-search>
            <div class="dlux-navbar-route-list" data-navbar-route-list></div>
        </section>
    </div>
</div>
