<div class="dlux-ribbon-builder dlux-table-columns" data-table-column-builder
     data-catalog='{{ table_columns_catalog_json }}' data-strings='{{ table_columns_strings_json }}'
     data-empty-project-label="{{ DLUX_STRINGS.table_columns_no_project_tables }}">
    <div class="d-flex flex-wrap align-items-start justify-content-between gap-2 mb-3">
        <p class="text-muted small mb-0">{{ DLUX_STRINGS.table_columns_intro }}</p>
        <div class="form-check form-switch small mb-0">
            <input class="form-check-input" type="checkbox" id="tableSystemItemsToggle-{{ mode }}" data-table-columns-system-toggle>
            <label class="form-check-label fw-semibold" for="tableSystemItemsToggle-{{ mode }}">{{ DLUX_STRINGS.sidebar_show_system_items|default:"Show system items" }}</label>
        </div>
    </div>
    <div class="dlux-ribbon-builder__models" data-table-column-models></div>
    <p class="text-muted small" data-table-columns-empty hidden>{{ DLUX_STRINGS.table_columns_empty }}</p>
    <div class="visually-hidden" aria-live="polite" data-table-columns-status></div>
</div>
