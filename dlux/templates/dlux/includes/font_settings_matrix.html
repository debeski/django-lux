<div data-setup-font-picker data-font-input="{{ input_id }}">
    {% if label %}
    <label class="form-label d-block">{{ label }}</label>
    {% endif %}
    {% if help_text %}
    <p class="text-muted small mb-3">{{ help_text }}</p>
    {% endif %}
    <div class="dlux-choice-selector dlux-choice-selector--swatch dlux-font-settings-matrix">
        <div class="dlux-choice-selector__options">
            {% for font in DLUX_FONTS %}
            <div
                class="dlux-choice-option dlux-choice-option--swatch dlux-font-settings-option"
                data-dlux-selector-option
                data-dlux-selector-text="{{ font.label }} {{ font.slug }}"
                data-font-option="{{ font.slug }}"
            >
                <div class="dlux-choice-option__surface">
                    <div class="dlux-font-settings-option__header">
                        <label class="dlux-font-settings-option__allow" for="id_allowed_font_{{ forloop.counter0 }}">
                            <input
                                type="checkbox"
                                class="form-check-input dlux-font-settings-option__checkbox"
                                id="id_allowed_font_{{ forloop.counter0 }}"
                                name="{{ allowed_input_name }}"
                                value="{{ font.slug }}"
                                aria-label="{{ font.label }}: {{ DLUX_STRINGS.form_sys_allowed_fonts|default:'Allowed Fonts' }}"
                                data-setup-font-allowed="{{ font.slug }}"
                                {% if font.slug in allowed_fonts %}checked{% endif %}
                            >
                        </label>
                    </div>
                    <div class="dlux-font-settings-option__content p-2 text-center">
                        <div class="font-preview-sample h2 mb-1">
                            Aa
                        </div>
                        <span class="dlux-choice-option__copy">
                            <span class="dlux-choice-option__label">{{ font.label }}</span>
                            <span class="dlux-choice-option__meta">{{ font.slug }}</span>
                        </span>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
