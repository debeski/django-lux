<div class="dlux-language-catalog" data-language-catalog-editor>
  <div class="d-flex flex-wrap align-items-end gap-2 mb-3">
    <div class="flex-grow-1">
      <label class="form-label fw-semibold" for="dlux-language-code-input">{{ DLUX_STRINGS.language_catalog_add_code|default:"Language code" }}</label>
      <input id="dlux-language-code-input" type="text" class="form-control glass-input" data-language-code-input placeholder="fr">
    </div>
    <div class="flex-grow-1">
      <label class="form-label fw-semibold" for="dlux-language-name-input">{{ DLUX_STRINGS.language_catalog_add_name|default:"Display name" }}</label>
      <input id="dlux-language-name-input" type="text" class="form-control glass-input" data-language-name-input placeholder="Francais">
    </div>
    <div>
      <label class="form-label fw-semibold" for="dlux-language-dir-input">{{ DLUX_STRINGS.language_catalog_add_dir|default:"Direction" }}</label>
      <select id="dlux-language-dir-input" class="form-select glass-input" data-language-dir-input>
        <option value="ltr">LTR</option>
        <option value="rtl">RTL</option>
      </select>
    </div>
    <div>
      <label class="form-label fw-semibold" for="dlux-language-flag-input">{{ DLUX_STRINGS.language_catalog_add_flag|default:"Flag" }}</label>
      <input id="dlux-language-flag-input" type="text" class="form-control glass-input dlux-language-flag-input" data-language-flag-input placeholder="FR">
    </div>
    <button type="button" class="btn btn-primary" data-language-add>
      <i class="bi bi-plus-lg me-1"></i>{{ DLUX_STRINGS.btn_add|default:"Add" }}
    </button>
  </div>

  {% if suggested_languages %}
  <div class="mb-3">
    <div class="small text-muted mb-2">{{ DLUX_STRINGS.language_catalog_suggestions|default:"Translation files also contain these languages. Add one to publish it to users." }}</div>
    <div class="d-flex flex-wrap gap-2">
      {% for code in suggested_languages %}
      <button type="button" class="btn btn-sm btn-outline-secondary" data-language-suggestion="{{ code }}">{{ code }}</button>
      {% endfor %}
    </div>
  </div>
  {% endif %}

  <div class="dlux-language-list" data-language-list>
    {% for lang in language_rows %}
    <div class="dlux-language-row" data-language-row data-language-code="{{ lang.code }}">
      <div class="dlux-language-row__code">{{ lang.code }}</div>
      <input id="dlux-language-name-row-{{ forloop.counter0 }}" type="text" class="form-control glass-input" data-language-name value="{{ lang.name|default:lang.code }}" aria-label="{{ DLUX_STRINGS.language_catalog_add_name|default:'Display name' }} ({{ lang.code }})">
      <select id="dlux-language-dir-row-{{ forloop.counter0 }}" class="form-select glass-input" data-language-dir aria-label="{{ DLUX_STRINGS.language_catalog_add_dir|default:'Direction' }} ({{ lang.code }})">
        <option value="ltr"{% if lang.dir != 'rtl' %} selected{% endif %}>LTR</option>
        <option value="rtl"{% if lang.dir == 'rtl' %} selected{% endif %}>RTL</option>
      </select>
      <input id="dlux-language-flag-row-{{ forloop.counter0 }}" type="text" class="form-control glass-input dlux-language-flag-input" data-language-flag value="{{ lang.flag|default:'' }}" aria-label="{{ DLUX_STRINGS.language_catalog_add_flag|default:'Flag' }} ({{ lang.code }})">
      <label class="dlux-language-default">
        <input id="dlux-language-default-row-{{ forloop.counter0 }}" type="radio" data-language-default value="{{ lang.code }}"{% if lang.code == default_language %} checked{% endif %}>
        <span>{{ DLUX_STRINGS.form_sys_default_lang|default:"Default" }}</span>
      </label>
      <button type="button" class="btn btn-sm btn-outline-danger" data-language-remove{% if lang.code == 'en' or lang.code == 'ar' %} disabled{% endif %}>
        <i class="bi bi-trash"></i>
      </button>
    </div>
    {% endfor %}
  </div>
</div>
