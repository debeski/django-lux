{% load static %}
<div data-setup-theme-picker data-theme-input="{{ input_id }}">
    {% if label %}
    <label class="form-label d-block">{{ label }}</label>
    {% endif %}
    {% if help_text %}
    <p class="text-muted small mb-3">{{ help_text }}</p>
    {% endif %}
    <div class="dl-choice-selector dl-choice-selector--swatch dl-theme-settings-matrix">
    <div class="dl-choice-selector__options">
        {% for theme in DLUX_THEMES %}
        <div
            class="dl-choice-option dl-choice-option--swatch dl-theme-settings-option{% if selected_theme == theme.slug %} is-default{% endif %}"
            data-dl-selector-option
            data-dl-selector-text="{{ theme.label }} {{ theme.slug }}"
            data-theme-option="{{ theme.slug }}"
            data-setup-theme-allow-toggle="{{ theme.slug }}"
        >
            <div class="dl-choice-option__surface">
                <div class="dl-theme-settings-option__header">
                    <label class="dl-theme-settings-option__allow" for="id_allowed_theme_{{ forloop.counter0 }}" data-setup-theme-allowed-control>
                        <input
                            type="checkbox"
                            class="form-check-input dl-theme-settings-option__checkbox"
                            id="id_allowed_theme_{{ forloop.counter0 }}"
                            name="{{ allowed_input_name }}"
                            value="{{ theme.slug }}"
                            aria-label="{{ theme.label }}: {{ MS_TRANS.form_sys_allowed_themes|default:'Allowed Themes' }}"
                            data-setup-theme-allowed="{{ theme.slug }}"
                            {% if theme.slug in allowed_themes %}checked{% endif %}
                        >
                    </label>
                </div>
                <div class="dl-theme-settings-option__select">
                    <button
                        type="button"
                        class="dl-theme-settings-option__preview"
                        data-setup-theme-choice="{{ theme.slug }}"
                        data-setup-theme-preview-url="{% static theme.css_path %}?v=20260523c"
                        aria-pressed="{% if selected_theme == theme.slug %}true{% else %}false{% endif %}"
                        aria-label="{{ MS_TRANS.form_sys_default_theme|default:'Default Theme' }}: {{ theme.label }}"
                        title="{{ MS_TRANS.form_sys_default_theme|default:'Default Theme' }}: {{ theme.label }}"
                    >
                        <span
                            class="dl-choice-option__swatch theme-preview dl-theme-preview dl-theme-preview--{{ theme.slug }}{% if selected_theme == theme.slug %} active{% endif %}"
                            data-theme="{{ theme.slug }}"
                            title="{{ theme.label }}"
                        ></span>
                    </button>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    </div>
</div>
