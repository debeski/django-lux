{% load static %}
<div class="dlux-font-picker" id="dluxFontPreviews">
    <div class="dlux-density-options" role="group" aria-label="{{ DLUX_STRINGS.typography }}">
    {% for font in option_fonts %}
        <button
            type="button"
            class="dlux-density-option dlux-font-option{% if selected_font == font.slug %} is-active{% endif %}"
            data-font="{{ font.slug }}"
        >
            <span class="dlux-density-option__icon dlux-font-option__icon" aria-hidden="true">
                <span class="font-preview-sample">Aa</span>
            </span>
            <span class="dlux-density-option__copy">
                <strong>{{ font.label }}</strong>
                <small>{{ font.slug }}</small>
            </span>
        </button>
    {% endfor %}
    </div>
</div>
