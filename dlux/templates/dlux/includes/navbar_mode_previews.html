<div class="dlux-table-density-picker dlux-navbar-mode-picker" data-navbar-mode-picker>
    <div class="dlux-density-options" role="group" aria-label="{{ DLUX_STRINGS.navbar_options_title }}">
        <button
            type="button"
            class="dlux-density-option{% if selected_mode == 'hierarchy' %} is-active{% endif %}"
            data-navbar-mode="hierarchy"
        >
            <span class="dlux-density-option__icon" aria-hidden="true">
                <i class="bi bi-diagram-3"></i>
            </span>
            <span class="dlux-density-option__copy">
                <strong>{{ DLUX_STRINGS.navbar_mode_hierarchy }}</strong>
                <small>{{ DLUX_STRINGS.navbar_mode_hierarchy_desc }}</small>
            </span>
        </button>
        <button
            type="button"
            class="dlux-density-option{% if selected_mode == 'history' %} is-active{% endif %}"
            data-navbar-mode="history"
        >
            <span class="dlux-density-option__icon" aria-hidden="true">
                <i class="bi bi-clock-history"></i>
            </span>
            <span class="dlux-density-option__copy">
                <strong>{{ DLUX_STRINGS.navbar_mode_history }}</strong>
                <small>{{ DLUX_STRINGS.navbar_mode_history_desc }}</small>
            </span>
        </button>
    </div>
</div>
