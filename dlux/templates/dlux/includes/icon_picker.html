<div class="dlux-icon-picker-field dlux-dependent-settings{% if disabled %} is-disabled{% endif %}" aria-disabled="{% if disabled %}true{% else %}false{% endif %}" data-dlux-icon-picker data-icon-field="{{ field_name }}" data-icon-default="{{ default_icon|default:'bi-list' }}" data-icon-directional="{{ directional_icons }}">
    <label class="form-label" for="dlux-icon-picker-input-{{ field_name }}-{{ mode }}">{{ label }}</label>
    <div class="input-group mb-2">
        <button type="button" class="input-group-text dlux-icon-picker-trigger" data-icon-toggle aria-expanded="false" aria-controls="dlux-icon-picker-body-{{ field_name }}-{{ mode }}" aria-label="{{ DLUX_STRINGS.icon_picker_browse|default:'Browse icons' }}" title="{{ DLUX_STRINGS.icon_picker_browse|default:'Browse icons' }}">
            <i class="bi {{ current_icon|default:'bi-list' }}" data-icon-preview></i>
            <i class="bi bi-chevron-down dlux-icon-picker-caret" aria-hidden="true"></i>
        </button>
        <input id="dlux-icon-picker-input-{{ field_name }}-{{ mode }}" type="text" class="form-control glass-input" data-icon-input value="{{ current_icon|default:'bi-list' }}" placeholder="{{ default_icon|default:'bi-list' }}" aria-describedby="dlux-icon-picker-help-{{ field_name }}-{{ mode }}">
        <button type="button" class="btn btn-outline-secondary" data-icon-reset aria-label="{{ DLUX_STRINGS.icon_picker_reset|default:'Reset' }}" title="{{ DLUX_STRINGS.icon_picker_reset|default:'Reset' }}"><i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i></button>
    </div>
    {% if help_text %}<div id="dlux-icon-picker-help-{{ field_name }}-{{ mode }}" class="form-text mb-2">{{ help_text }}</div>{% endif %}
    <div id="dlux-icon-picker-body-{{ field_name }}-{{ mode }}" class="dlux-builder-icon-picker p-2 rounded-4 border d-none" data-icon-picker-body>
        <label for="dlux-icon-picker-search-{{ field_name }}-{{ mode }}" class="visually-hidden">{{ DLUX_STRINGS.sidebar_icon_search|default:'Search icons' }}</label>
        <input id="dlux-icon-picker-search-{{ field_name }}-{{ mode }}" type="search" class="form-control form-control-sm glass-input mb-2" data-icon-search placeholder="{{ DLUX_STRINGS.sidebar_icon_search|default:'Search icons...' }}" aria-label="{{ DLUX_STRINGS.sidebar_icon_search|default:'Search icons' }}">
        <div class="dlux-builder-icon-suggestions" data-icon-suggestions></div>
    </div>
</div>
