{% load django_tables2 %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="modal-title mb-0">{{ DLUX_STRINGS.manage_groups_label|default:"Manage Groups" }}</h5>
    <button type="button" class="btn btn-success rounded-pill js-group-nav"
            data-url="{% url 'get_group_form' %}">
        <i class="bi bi-plus-lg me-1"></i> {{ DLUX_STRINGS.add_group|default:"Add Group" }}
    </button>
</div>

<p class="text-muted small">{{ DLUX_STRINGS.manage_groups_desc|default:"Reusable permission presets. Members inherit every permission in the preset." }}</p>

{% render_table table %}
