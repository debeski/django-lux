name: CI

# Green-checkmark gate: runs the curated package Django test suite on every
# push/PR to main and the owner-requested 1.14.1 stabilization line.

on:
  push:
    branches: [main, release/1.14.1]
  pull_request:
    branches: [main, release/1.14.1]

permissions:
  contents: read

jobs:
  settings-postgres:
    uses: ./.github/workflows/settings-postgres.yml

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[pdf]'

      - name: Run package Django test suite
        run: |
          python dlux/tests/test_all.py
