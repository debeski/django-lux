name: CI

# Green-checkmark gate: runs the curated package Django test suite on every
# push/PR to main. Releases still run independently through release.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The same suite on PostgreSQL, which every deployed stack runs: foreign keys
  # are checked at once, SELECT ... FOR UPDATE really locks, closed connections
  # stay closed. It includes test_settings_persistence, so the narrower
  # settings-postgres.yml gate is left to release.yml.
  test-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: dlux_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dlux_tests"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: dlux.tests.settings_postgres
      DLUX_TEST_POSTGRES_DB: dlux_tests
      DLUX_TEST_POSTGRES_USER: postgres
      DLUX_TEST_POSTGRES_PASSWORD: test-only
      DLUX_TEST_POSTGRES_HOST: localhost
      DLUX_TEST_POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package, dependencies and PostgreSQL driver
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[pdf]' psycopg2-binary

      - name: Run package Django test suite on PostgreSQL
        # A hang dumps every thread's Python stack (faulthandler on SIGABRT)
        # and fails the step, well inside the job's timeout-minutes.
        env:
          PYTHONFAULTHANDLER: "1"
        run: timeout --signal=ABRT --kill-after=1m 20m python dlux/tests/test_all.py --noinput

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[pdf]'

      - name: Run package Django test suite
        # A hang dumps every thread's Python stack (faulthandler on SIGABRT)
        # and fails the step, well inside the job's timeout-minutes.
        env:
          PYTHONFAULTHANDLER: "1"
        run: timeout --signal=ABRT --kill-after=1m 20m python dlux/tests/test_all.py

  dlb-viewer:
    # The backup viewer ships in every release (release.yml cross-compiles it);
    # its own tests, race detector and vet run on every change.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Test the viewer
        working-directory: tools/dlb-viewer
        run: |
          go vet ./...
          go test -race ./...
