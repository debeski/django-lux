<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="dlb-token" content="__DLB_TOKEN__">
  <title>Dlux Backup Viewer (.dlb)</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">DLB</span>
      <span class="title">Dlux Backup Viewer</span>
    </div>
    <div class="source" id="source-label"></div>
  </header>

  <main id="app">
    <!-- Step 1: choose a file -->
    <section id="screen-open" class="screen card">
      <h1>Open a backup</h1>
      <p class="muted">Select a Dlux <code>.dlb</code> file to inspect. Nothing leaves this machine — decryption happens locally.</p>

      <div id="dropzone" class="dropzone">
        <p><strong>Drag &amp; drop</strong> a <code>.dlb</code> file here</p>
        <p class="muted">or</p>
        <label class="btn">
          Choose file…
          <input type="file" id="file-input" accept=".dlb" hidden>
        </label>
      </div>

      <details class="path-open">
        <summary>Open by path instead</summary>
        <div class="row">
          <input type="text" id="path-input" placeholder="/absolute/path/to/system-backup.dlb" spellcheck="false">
          <button class="btn" id="path-btn">Open</button>
        </div>
      </details>

      <p class="error" id="open-error" hidden></p>
    </section>

    <!-- Step 2: unlock -->
    <section id="screen-unlock" class="screen card" hidden>
      <h1>Unlock backup</h1>
      <dl class="meta-grid" id="unlock-meta"></dl>

      <form id="unlock-form">
        <label id="password-label" for="password-input">Password</label>
        <p class="muted" id="password-hint"></p>
        <div class="row">
          <input type="password" id="password-input" autocomplete="off" spellcheck="false" autofocus>
          <button type="button" class="btn ghost" id="toggle-pw" title="Show / hide">👁</button>
          <button type="submit" class="btn" id="unlock-btn">Unlock</button>
        </div>
        <p class="error" id="unlock-error" hidden></p>
      </form>
      <button class="link" id="back-to-open">← choose a different file</button>
    </section>

    <!-- Step 3: browse -->
    <section id="screen-browse" class="screen browse" hidden>
      <aside class="sidebar">
        <div class="sidebar-section">
          <button class="navitem" data-view="overview">Overview</button>
          <button class="navitem" data-view="files">Stored files</button>
          <button class="navitem" data-view="migrations">Migration state</button>
          <button class="navitem" data-view="manifest">Raw manifest</button>
        </div>
        <div class="sidebar-section">
          <div class="sidebar-heading">Models</div>
          <div id="model-list"></div>
        </div>
      </aside>
      <div class="content" id="content"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
