[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-lux-sso"
dynamic = ["version"]
description = "Optional OIDC SSO provider plugin for django-lux."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "DeBeski", email = "debeski1@gmail.com" }
]
dependencies = [
    "Django>=5.1",
    "django-lux>=1.0.0",
    "django-oauth-toolkit[oidc]>=3.0",
    "cryptography>=42.0",
]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 5",
    "Framework :: Django :: 6",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/debeski/django-lux"

[tool.setuptools.packages.find]
include = ["dlux_sso", "dlux_sso.*"]

[tool.setuptools.dynamic]
version = { attr = "dlux_sso.__version__" }

[tool.setuptools.package-data]
dlux_sso = ["VERSION"]
