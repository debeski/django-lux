[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-lux-sso-client"
dynamic = ["version"]
description = "Lightweight Django OIDC client SDK for Dlux SSO providers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "DeBeski", email = "debeski1@gmail.com" }
]
dependencies = [
    "Django>=4.2",
    "mozilla-django-oidc>=4.0.0",
]
classifiers = [
    "Framework :: Django",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/debeski/django-lux"

[tool.setuptools.packages.find]
include = ["dlux_sso_client", "dlux_sso_client.*"]

[tool.setuptools.dynamic]
version = { attr = "dlux_sso_client.__version__" }

[tool.setuptools.package-data]
dlux_sso_client = ["VERSION"]
