[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-microsys-sso-client"
version = "0.1.0"
description = "Lightweight Django OIDC client SDK for Microsys SSO providers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "NON-COMMERCIAL" }
authors = [
    { name = "DeBeski", email = "debeski1@gmail.com" }
]
dependencies = [
    "Django>=4.2",
    "mozilla-django-oidc>=4.0.0",
]
classifiers = [
    "Framework :: Django",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: Other/Proprietary License",
]

[project.urls]
Homepage = "https://github.com/debeski/django-microsys"

[tool.setuptools.packages.find]
include = ["microsys_sso_client", "microsys_sso_client.*"]

