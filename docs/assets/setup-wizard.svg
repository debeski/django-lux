<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">microSYS setup wizard screenshot placeholder</title>
  <desc id="desc">Reserved slot for a future screenshot of the first-launch setup wizard.</desc>
  <rect width="1200" height="720" fill="#0f172a"/>
  <rect x="60" y="60" width="1080" height="600" rx="28" fill="#f8fafc"/>
  <rect x="110" y="120" width="980" height="70" rx="18" fill="#e2e8f0"/>
  <rect x="110" y="220" width="300" height="340" rx="24" fill="#dbeafe"/>
  <rect x="450" y="220" width="300" height="340" rx="24" fill="#ede9fe"/>
  <rect x="790" y="220" width="300" height="340" rx="24" fill="#dcfce7"/>
  <text x="120" y="175" fill="#0f172a" font-family="Arial, sans-serif" font-size="34" font-weight="700">Setup Wizard Capture Slot</text>
  <text x="160" y="295" fill="#0f172a" font-family="Arial, sans-serif" font-size="28" font-weight="700">Step 1</text>
  <text x="160" y="335" fill="#334155" font-family="Arial, sans-serif" font-size="22">Branding, theme,</text>
  <text x="160" y="367" fill="#334155" font-family="Arial, sans-serif" font-size="22">language, and home URL</text>
  <text x="500" y="295" fill="#0f172a" font-family="Arial, sans-serif" font-size="28" font-weight="700">Step 2</text>
  <text x="500" y="335" fill="#334155" font-family="Arial, sans-serif" font-size="22">Languages and</text>
  <text x="500" y="367" fill="#334155" font-family="Arial, sans-serif" font-size="22">translation overrides</text>
  <text x="840" y="295" fill="#0f172a" font-family="Arial, sans-serif" font-size="28" font-weight="700">Step 3</text>
  <text x="840" y="335" fill="#334155" font-family="Arial, sans-serif" font-size="22">Sidebar builder</text>
  <text x="840" y="367" fill="#334155" font-family="Arial, sans-serif" font-size="22">and inspector</text>
  <text x="120" y="620" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="24">Replace this placeholder with a real screenshot from /sys/setup/ when a seeded demo project is available.</text>
</svg>
