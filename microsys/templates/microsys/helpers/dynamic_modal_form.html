{% load crispy_forms_tags %}

<form method="post"
      class="microsys-form{% if form.extra_form_class %} {{ form.extra_form_class }}{% endif %}"
      action="{{ request.path }}{% if request.GET %}?{{ request.GET.urlencode }}{% endif %}"
      {% if form.is_multipart %}enctype="multipart/form-data"{% endif %}
      {% if wizard_initial_step is not None %}data-ms-wizard-initial-step="{{ wizard_initial_step }}"{% endif %}>
    {% csrf_token %}
    {% crispy form %}
    {% if not hide_form_buttons %}
        <div class="microsys-form-actions mt-3 pt-3 border-top">
            {% if instance %}
                <button type="submit" class="microsys-form-action microsys-form-action-primary" aria-label="{{ MS_TRANS.btn_update|default:'تحديث' }}" title="{{ MS_TRANS.btn_update|default:'تحديث' }}">
                    <span class="microsys-form-action-icon"><i class="bi bi-check-lg" aria-hidden="true"></i></span>
                    <span class="visually-hidden">{{ MS_TRANS.btn_update|default:"تحديث" }}</span>
                </button>
                <button type="button" class="microsys-form-action microsys-form-action-neutral dynamic-back-btn" aria-label="{{ MS_TRANS.btn_cancel|default:'إلغاء' }}" title="{{ MS_TRANS.btn_cancel|default:'إلغاء' }}">
                    <span class="microsys-form-action-icon"><i class="bi bi-x-lg" aria-hidden="true"></i></span>
                    <span class="visually-hidden">{{ MS_TRANS.btn_cancel|default:"إلغاء" }}</span>
                </button>
            {% else %}
                <button type="submit" class="microsys-form-action microsys-form-action-primary" aria-label="{{ MS_TRANS.btn_add_new|default:'إضافة' }}" title="{{ MS_TRANS.btn_add_new|default:'إضافة' }}">
                    <span class="microsys-form-action-icon"><i class="bi bi-check-lg" aria-hidden="true"></i></span>
                    <span class="visually-hidden">{{ MS_TRANS.btn_add_new|default:"إضافة" }}</span>
                </button>
            {% endif %}
        </div>
    {% endif %}
</form>
