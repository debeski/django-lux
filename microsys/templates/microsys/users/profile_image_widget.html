{% load static %}
<div class="ms-profile-image-input-wrapper">
    <div class="ms-profile-image-preview-area">
        {% if widget.value %}
            <img src="{{ widget.value.url }}" alt="Profile Preview" class="ms-image-preview-circle" id="ms-profile-preview-{{ widget.attrs.id }}">
        {% else %}
            <div class="ms-image-preview-circle ms-image-placeholder" id="ms-profile-preview-{{ widget.attrs.id }}">
                <i class="bi bi-person-fill"></i>
            </div>
        {% endif %}
        
        <label for="{{ widget.attrs.id }}" class="ms-image-upload-label" title="{{ MS_TRANS.btn_update|default:'Update' }}">
            <i class="bi bi-camera-fill"></i>
        </label>
    </div>
    <input type="{{ widget.type }}" name="{{ widget.name }}" {% if widget.value %}value="{{ widget.value }}"{% endif %} {% for name, value in widget.attrs.items %}{{ name }}="{{ value }}" {% endfor %} class="d-none ms-profile-file-input" data-preview-target="ms-profile-preview-{{ widget.attrs.id }}">
</div>
<script src="{% static 'microsys/users/js/profile_image_widget.js' %}?v=20260511a" nonce="{{ request.csp_nonce }}" defer></script>
