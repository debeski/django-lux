<div{% if picker_mode == 'setup' %} data-setup-language-picker data-language-input="{{ input_id }}"{% endif %}>
    {% if label %}
    <label class="form-label d-block">{{ label }}</label>
    {% endif %}
    <div class="ms-choice-selector ms-choice-selector--swatch">
    <div class="ms-choice-selector__options">
        {% for code, lang in languages.items %}
        <div>
            <div
                class="lang-option ms-choice-option__surface rounded border shadow-sm p-2 mb-1{% if code == selected_language %} lang-active{% endif %}"
                {% if picker_mode == 'options' %}data-lang="{{ code }}"{% endif %}
                {% if picker_mode == 'setup' %}data-setup-language-choice="{{ code }}"{% endif %}
                data-dir="{{ lang.dir|default:'ltr' }}"
                style="cursor: pointer; min-width: 80px;"
                title="{{ lang.name|default:code }}"
            >
                <span style="font-size: 1.5rem;">{{ lang.flag|default:"🌐" }}</span>
            </div>
            <small class="text-muted">{{ lang.name|default:code }}</small>
        </div>
        {% endfor %}
    </div>
    </div>
</div>
