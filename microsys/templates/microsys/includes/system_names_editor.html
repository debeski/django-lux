<div class="ms-system-names-editor" data-system-names-editor>
  <div class="ms-system-name-list" data-system-name-list>
    {% for lang in language_rows %}
    <div class="ms-system-name-row" data-system-name-row data-language-code="{{ lang.code }}">
      <div class="ms-system-name-row__meta">
        <span class="ms-system-name-row__code">{{ lang.code }}</span>
        <span class="ms-system-name-row__label">{{ lang.name|default:lang.code }}</span>
      </div>
      <input
        id="ms-system-name-{{ forloop.counter0 }}"
        type="text"
        class="form-control glass-input"
        data-system-name-input
        value="{{ lang.system_name|default:'' }}"
        placeholder="{{ MS_TRANS.form_sys_system_name_placeholder|default:'System name' }}"
        aria-label="{{ MS_TRANS.form_sys_system_names|default:'System names by language' }} ({{ lang.code }})"
      >
    </div>
    {% endfor %}
  </div>
</div>
