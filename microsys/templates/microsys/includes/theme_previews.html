<div{% if picker_mode == 'setup' %} data-setup-theme-picker data-theme-input="{{ input_id }}"{% endif %}>
    {% if label %}
    <label class="form-label d-block">{{ label }}</label>
    {% endif %}
    <div class="d-flex flex-wrap gap-3">
        {% for theme in MICROSYS_THEMES %}
        <div class="text-center">
            <div
                class="rounded-circle border shadow-sm mb-1 theme-preview{% if selected_theme == theme.slug %} active{% endif %}"
                style="width: 45px; height: 45px; {{ theme.preview_style }} cursor: pointer;"
                data-theme="{{ theme.slug }}"
                title="{{ theme.label }}"
            ></div>
            <small class="text-muted">{{ theme.label }}</small>
        </div>
        {% endfor %}
    </div>
</div>
