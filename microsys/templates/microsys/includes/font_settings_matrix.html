<div data-setup-font-picker data-font-input="{{ input_id }}">
    {% if label %}
    <label class="form-label d-block">{{ label }}</label>
    {% endif %}
    {% if help_text %}
    <p class="text-muted small mb-3">{{ help_text }}</p>
    {% endif %}
    <div class="ms-choice-selector ms-choice-selector--swatch ms-font-settings-matrix">
        <div class="ms-choice-selector__options">
            {% for font in MICROSYS_FONTS %}
            <div
                class="ms-choice-option ms-choice-option--swatch ms-font-settings-option"
                data-ms-selector-option
                data-ms-selector-text="{{ font.label }} {{ font.slug }}"
                data-font-option="{{ font.slug }}"
            >
                <div class="ms-choice-option__surface">
                    <div class="ms-font-settings-option__header">
                        <label class="ms-font-settings-option__allow" for="id_allowed_font_{{ forloop.counter0 }}">
                            <input
                                type="checkbox"
                                class="form-check-input ms-font-settings-option__checkbox"
                                id="id_allowed_font_{{ forloop.counter0 }}"
                                name="{{ allowed_input_name }}"
                                value="{{ font.slug }}"
                                aria-label="{{ font.label }}: {{ MS_TRANS.form_sys_allowed_fonts|default:'Allowed Fonts' }}"
                                data-setup-font-allowed="{{ font.slug }}"
                                {% if font.slug in allowed_fonts %}checked{% endif %}
                            >
                        </label>
                    </div>
                    <div class="ms-font-settings-option__content p-2 text-center">
                        <div class="font-preview-sample h2 mb-1" style="font-family: '{{ font.label }}', sans-serif !important;">
                            Aa
                        </div>
                        <span class="ms-choice-option__copy">
                            <span class="ms-choice-option__label">{{ font.label }}</span>
                            <span class="ms-choice-option__meta">{{ font.slug }}</span>
                        </span>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>

<style>
    .ms-font-settings-option__header {
        position: absolute;
        top: 8px;
        right: 8px;
        z-index: 2;
    }
    [dir="rtl"] .ms-font-settings-option__header {
        right: auto;
        left: 8px;
    }
    .ms-font-settings-option {
        position: relative;
        min-width: 120px;
    }
</style>
