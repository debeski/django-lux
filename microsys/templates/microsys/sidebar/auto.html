<div class="sidebar-auto-items" id="sidebarAutoItems">
{% for item in items %}
<a href="{{ item.url }}" 
   class="list-group-item list-group-item-action sidebar-tree-node sidebar-root-item{% if item.active %} active{% endif %}"
   data-url-name="{{ item.url_name }}">
    <i class="bi {{ item.icon }} me-2"></i>
    <span>{{ item.label }}</span>
</a>
{% endfor %}
{% if not items and not has_extra %}
<div class="p-3 text-center text-muted small">
    <i class="bi bi-inbox mb-2"></i>
    <p class="mb-0">{{ MS_TRANS.no_items }}</p>
</div>
{% endif %}
</div>
