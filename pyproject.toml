[build-system]
requires = [
    "setuptools<69",
    "wheel<0.41"
]
build-backend = "setuptools.build_meta"


[project]
name = "django_lux"
dynamic = ["version"]
description = "DjangoLux - A modern UX/UI framework for Django: a themeable, multilingual design system plus batteries-included app infrastructure (auth, CRUD, audit, navigation)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "DeBeski", email = "debeski1@gmail.com" }
]
keywords = ["django", "dlux", "permissions", "authentication"]

# Dependencies
dependencies = [
    "Django>=5.1",
    "django-crispy-forms>=2.4",
    "django-tables2>=2.7",
    "django-filter>=24.3",
    "crispy-bootstrap5>=2025.6",
    "psutil>=7.0.0",
    "pyotp>=2.9",
    "qrcode>=8.2",
    "pillow>=11.0",
    "babel>=2.1",
    "cryptography>=42.0",
    "openpyxl>=3.1",
    "packaging>=24.0",
]

# Classifiers
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 5",
    "Framework :: Django :: 6",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# Tell setuptools which packages to include
[tool.setuptools.packages.find]
include = ["dlux", "dlux.*"]
exclude = ["dlux.tests", "dlux.tests.*"]

# Include static/templates files (equivalent to include_package_data=True)
[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "dlux.__version__" }

[tool.setuptools.package-data]
dlux = [
    "release-manifest.json",
]
"dlux.contracts" = ["*.json"]
# Recursive on purpose. This used to be four hardcoded depths under dlux/, and
# the tree already reached the deepest one — a fifth directory level would have
# been dropped from the wheel with no error anywhere, failing only for installed
# users. dlux/tests/test_scaffold.py asserts every .tmpl on disk is covered.
"dlux.scaffold" = ["templates/**/*.tmpl"]

[project.urls]
Homepage = "https://github.com/debeski/django-lux"

[project.scripts]
dlux = "dlux.cli:main"

[project.optional-dependencies]
updater = [
    "pypi-attestations>=0.0.29",
]
sso = [
    "django-lux-sso>=0.1.0",
]
