[build-system]
requires = [
    "setuptools<69",
    "wheel<0.41"
]
build-backend = "setuptools.build_meta"


[project]
name = "django_microsys"
dynamic = ["version"]
description = "Django microSYS (System Integration Service) - Multilingual Django Starter Pack, Packed with Features."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "NON-COMMERCIAL" }
authors = [
    { name = "DeBeski", email = "debeski1@gmail.com" }
]
keywords = ["django", "microsys", "permissions", "authentication"]

# Dependencies
dependencies = [
    "Django>=5.1",
    "django-crispy-forms>=2.4",
    "django-tables2>=2.7",
    "django-filter>=24.3",
    "crispy-bootstrap5>=2025.6",
    "psutil>=7.0.0",
    "pyotp>=2.9",
    "qrcode>=8.2",
    "pillow>=11.0",
    "babel>=2.1",
    "cryptography>=42.0",
]

# Classifiers
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 5",
    "Framework :: Django :: 6",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
]

# Tell setuptools which packages to include
[tool.setuptools.packages.find]
include = ["microsys", "microsys.*"]
exclude = ["microsys.tests", "microsys.tests.*"]

# Include static/templates files (equivalent to include_package_data=True)
[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "microsys.__version__" }

[tool.setuptools.package-data]
microsys = [
    "VERSION",
    "scaffold_templates/*.tmpl",
    "scaffold_templates/*/*.tmpl",
    "scaffold_templates/*/*/*.tmpl",
    "scaffold_templates/*/*/*/*.tmpl",
]

[project.urls]
Homepage = "https://github.com/debeski/django-microsys"

[project.scripts]
ms = "microsys.cli:main"

[project.optional-dependencies]
sso = [
    "django-microsys-sso>=0.1.0",
]
